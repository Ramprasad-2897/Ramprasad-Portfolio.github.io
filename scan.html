<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramprasad Dorbala — Portfolio &amp; Resume</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a; color: #f1f5f9;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card { text-align: center; max-width: 420px; width: 100%; }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 700; color: #0f172a;
    margin: 0 auto 18px;
  }
  h1 { font-size: 26px; margin-bottom: 6px; }
  p.sub { color: #94a3b8; font-size: 15px; margin-bottom: 28px; }
  a.btn {
    display: block; text-decoration: none; color: #0f172a;
    background: #38bdf8; font-weight: 600; font-size: 17px;
    padding: 16px; border-radius: 14px; margin-bottom: 14px;
    transition: transform .12s ease, background .12s ease;
  }
  a.btn:hover { background: #7dd3fc; transform: translateY(-2px); }
  a.btn.secondary { background: #1e293b; color: #f1f5f9; border: 1px solid #334155; }
  a.btn.secondary:hover { background: #273449; }
  .note { margin-top: 22px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">R</div>
    <h1>Ramprasad Dorbala</h1>
    <p class="sub">Data Analyst &amp; BI Analyst — Las Vegas, NV</p>
    <a class="btn" href="./index.html">View Portfolio</a>
    <a class="btn secondary" href="./Ramprasad_Dorbala_Resume.pdf">View Resume</a>
    <p class="note">Scan QR se vachharu — choose what to open.</p>
  </div>
</body>
</html>
